<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262624">
<title>DomainDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#262624;--s1:#30302e;--s2:#3b3a37;--bd:#46453f;--tx:#faf9f5;--mu:#a8a69c;--cy:#d97757;--mg:#c6613f;--au:#e0b25c;--gn:#8cc084;--rd:#e8776d;--r:12px}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font:15px/1.55 -apple-system,'Segoe UI',Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.big,.logo{font-family:'Source Serif 4',Georgia,serif;font-weight:500;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--cy);color:#fff;font-weight:600;padding:9px 16px;border-radius:10px;transition:background .15s}
.btn:hover{background:var(--mg)}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:#45443f}
.btn.d{background:transparent;color:var(--rd);border:1px solid var(--bd)}.btn.d:hover{background:#402a28}
.btn.sm{padding:5px 11px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--cy);outline:0}
input[type=checkbox]{width:auto;padding:0;accent-color:var(--cy)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:32px;width:min(380px,100%);text-align:center}
.lbox h1{font-size:30px;margin-bottom:6px}.lbox p{color:var(--mu);margin-bottom:18px}.lbox input{margin-bottom:12px;text-align:center}
#err{color:var(--rd);min-height:22px;font-size:13px;margin-bottom:6px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav{background:#1f1e1d;border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.logo{font-size:22px;margin:0 10px 18px}
nav button{background:none;text-align:left;padding:9px 12px;border-radius:8px;color:var(--mu);font-weight:500}
nav button:hover{background:var(--s1);color:var(--tx)}nav button.on{background:var(--s2);color:var(--tx)}
main{padding:28px;max-width:1100px;width:100%;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.top h2{font-size:28px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px}
.stat span{color:var(--mu);font-size:13px}.big{font-size:28px;margin-top:2px;line-height:1.25}
.big.in{color:var(--tx)}.big.up{color:var(--gn)}.big.dn{color:var(--rd)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.row:last-child{border:0}.row small{color:var(--mu);display:block}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.tag.sold,.tag.avail{background:#2e3a2b;color:var(--gn)}.tag.listed{background:#3d3524;color:var(--au)}.tag.owned{background:#3d2f29;color:var(--cy)}.tag.taken{background:#402a28;color:var(--rd)}
label.tag{display:inline-flex;align-items:center;gap:6px;color:var(--tx);padding:5px 11px;font-size:13px;border:1px solid var(--bd);margin:0}
label.tag:has(input:checked){border-color:var(--cy);background:#3d2f29}
.lk{color:var(--cy);font-size:12px;margin-right:8px;text-decoration:none}.lk:hover{text-decoration:underline}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;border-radius:4px 4px 0 0;background:var(--cy);min-height:3px;margin-bottom:4px}.bars i.neg{background:var(--rd)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;color:var(--mu);font-weight:500;font-size:13px;padding:8px}td{padding:10px 8px;border-top:1px solid var(--bd);overflow-wrap:anywhere}
#chat{height:min(52vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--s2);overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:#3d2f29;border:1px solid #5a3f33;white-space:pre-wrap}
.m small{display:block;color:var(--mu);margin-top:4px;font-size:11px}
.send{display:flex;gap:8px;margin-top:12px}.send .btn{flex:none}
.md p,.md ul,.md ol,.md pre,.md blockquote{margin:0 0 .6em}.md>*:last-child{margin-bottom:0}
.md ul,.md ol{padding-left:1.3em}.md li{margin:.15em 0}.md h4{font-size:16px;margin:.4em 0 .3em}
.md code{background:#1f1e1d;padding:1px 6px;border-radius:5px;font:.88em ui-monospace,Consolas,monospace}
.md pre{background:#1f1e1d;border:1px solid var(--bd);padding:10px 12px;border-radius:8px;overflow-x:auto}.md pre code{padding:0;background:none}
.md blockquote{border-left:3px solid var(--cy);padding-left:10px;color:var(--mu)}.md a{color:var(--cy)}.md hr{border:0;border-top:1px solid var(--bd);margin:.8em 0}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(520px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:#000a}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f2>div{margin-bottom:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s2);padding:10px 18px;border-radius:10px;z-index:9;border:1px solid var(--bd);max-width:92vw}
.muted{color:var(--mu)}.pre{white-space:pre-wrap}
.score{height:6px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.score i{display:block;height:100%;background:var(--cy)}
@media(max-width:820px){
.app{grid-template-columns:minmax(0,1fr)}
nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;gap:4px;overflow-x:auto;overflow-y:hidden;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5;border-top:1px solid var(--bd);border-right:0}
.logo{display:none}nav button{flex:0 0 auto;padding:10px 14px;white-space:nowrap}#out{margin:0 0 0 auto!important}
main{padding:18px 14px 90px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:minmax(0,1fr)}.big{font-size:22px}.toast{bottom:84px}}
@media(max-width:520px){.f2{grid-template-columns:1fr}.top h2{font-size:23px}}
</style>
</head>
<body>
<div id="login" class="hide">
 <form class="lbox" id="lf">
  <h1>DomainDesk</h1><p>Private workspace. Enter the admin password.</p>
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required>
  <div id="err"></div><button class="btn" style="width:100%">Unlock</button>
 </form>
</div>

<div class="app hide" id="app">
 <nav id="nav">
  <div class="logo">DomainDesk</div>
  <button data-v="dash" class="on">Dashboard</button><button data-v="doms">Domains</button><button data-v="ana">Analytics</button><button data-v="chk">Checker</button><button data-v="ai">AI Coach</button><button data-v="tools">Tools</button>
  <button id="out" style="margin-top:auto">Lock</button>
 </nav>
 <main id="main"></main>
</div>

<dialog id="dlg">
 <form id="df" method="dialog">
  <h3 id="dt" style="margin-bottom:14px">Add domain</h3>
  <div class="f2">
   <div style="grid-column:1/-1"><label>Domain</label><input id="f_name" placeholder="example.com" required></div>
   <div><label>Status</label><select id="f_status"><option value="watching">Watching</option><option value="owned">Owned</option><option value="listed">Listed for sale</option><option value="sold">Sold</option></select></div>
   <div><label>Registrar / marketplace</label><input id="f_reg" placeholder="Namecheap"></div>
   <div><label>Bought for ($)</label><input id="f_buy" type="number" step="0.01" min="0"></div>
   <div><label>Bought on</label><input id="f_bd" type="date"></div>
   <div><label>Asking price ($)</label><input id="f_ask" type="number" step="0.01" min="0"></div>
   <div><label>Sold for ($)</label><input id="f_sell" type="number" step="0.01" min="0"></div>
   <div><label>Sold on</label><input id="f_sd" type="date"></div>
   <div><label>Renewal date</label><input id="f_rn" type="date"></div>
   <div style="grid-column:1/-1"><label>Notes</label><textarea id="f_note" rows="2"></textarea></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button type="button" class="btn g" id="cx">Cancel</button><button class="btn">Save domain</button></div>
 </form>
</dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$$=n=>'$'+(+n||0).toLocaleString(undefined,{maximumFractionDigits:0});

/* ---------- Markdown for AI replies ---------- */
const md=s=>{
 const keep=[],K=h=>'\u0001'+(keep.push(h)-1)+'\u0001';
 const t=esc(s).replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>K('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>')).replace(/`([^`\n]+)`/g,(_,c)=>K('<code>'+c+'</code>'));
 const il=x=>x.replace(/\*\*(.+?)\*\*|__(.+?)__/g,(_,a,b)=>'<strong>'+(a||b)+'</strong>')
  .replace(/(^|[^*\w])\*([^\s*](?:[^*]*[^\s*])?)\*(?!\*)/g,'$1<em>$2</em>')
  .replace(/(^|[^_\w])_([^\s_](?:[^_]*[^\s_])?)_(?!\w)/g,'$1<em>$2</em>')
  .replace(/~~(.+?)~~/g,'<del>$1</del>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 const out=[];let list=null;const close=()=>{if(list){out.push('</'+list+'>');list=null}};
 for(const ln of t.split('\n')){let m;
  if(/^\u0001\d+\u0001$/.test(ln.trim())){close();out.push(ln.trim())}
  else if(m=ln.match(/^\s*[-*\u2022]\s+(.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+il(m[1])+'</li>')}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+il(m[1])+'</li>')}
  else if(m=ln.match(/^#{1,6}\s+(.*)/)){close();out.push('<h4>'+il(m[1])+'</h4>')}
  else if(m=ln.match(/^&gt;\s?(.*)/)){close();out.push('<blockquote>'+il(m[1])+'</blockquote>')}
  else if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){close();out.push('<hr>')}
  else if(!ln.trim())close();
  else{close();out.push('<p>'+il(ln)+'</p>')}}
 close();return out.join('').replace(/\u0001(\d+)\u0001/g,(_,i)=>keep[i])};

/* ---------- IndexedDB ---------- */
const DB=new Promise((ok,no)=>{const q=indexedDB.open('domaindesk',1);q.onupgradeneeded=()=>{q.result.createObjectStore('domains',{keyPath:'id'});q.result.createObjectStore('kv')};q.onsuccess=()=>ok(q.result);q.onerror=no});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>ok(o.result);t.onerror=()=>no(t.error)})};
const allD=()=>tx('domains','readonly',s=>s.getAll()),putD=d=>tx('domains','readwrite',s=>s.put(d)),delD=id=>tx('domains','readwrite',s=>s.delete(id));
const kget=k=>tx('kv','readonly',s=>s.get(k)),kset=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));

/* ---------- Auth + AI ---------- */
let tok=localStorage.getItem('dd_tok'),view='dash',D=[],busy=false;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide')}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Login failed');tok=d.token;localStorage.setItem('dd_tok',tok);$('#pw').value='';boot()}catch(x){$('#err').textContent=x.message}};
$('#out').onclick=()=>{localStorage.removeItem('dd_tok');tok=null;showLogin()};
async function ai(prompt,json){
 const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({prompt,json})});
 if(r.status===401){$('#out').click();throw new Error('Session expired')}
 const d=await r.json();if(!r.ok)throw new Error((d.error||'AI failed')+(d.details?.length?' ('+d.details[0]+')':''));return d}
const parse=t=>JSON.parse(t.replace(/```json|```/g,'').trim());

/* ---------- Domain math ---------- */
const inv=d=>d.status==='watching'?0:+d.buy||0;
const profit=d=>d.status==='sold'?(+d.sell||0)-(+d.buy||0):null;
const days=d=>d.bd?Math.max(0,Math.round(((d.status==='sold'&&d.sd?new Date(d.sd):new Date())-new Date(d.bd))/864e5)):null;
function score(name){
 const [n,...t]=name.toLowerCase().split('.'),tld='.'+t.join('.');let s=50;
 s+={'.com':25,'.ai':18,'.io':12,'.co':8,'.net':6,'.org':6,'.app':6,'.dev':5}[tld]??-5;
 s+=n.length<=5?20:n.length<=8?12:n.length<=12?2:-12;
 if(/-/.test(n))s-=15;if(/\d/.test(n))s-=12;
 const v=(n.match(/[aeiou]/g)||[]).length/n.length;if(v<.22||v>.65)s-=10;
 if(/(.)\1\1/.test(n))s-=5;return Math.max(5,Math.min(98,s))}
const summary=()=>D.map(d=>`${d.name} [${d.status}] buy $${d.buy||0}${d.ask?` ask $${d.ask}`:''}${d.sell?` sold $${d.sell}`:''}`).join('; ')||'no domains yet';
const totals=()=>{const I=D.reduce((a,d)=>a+inv(d),0),O=D.filter(d=>d.status==='sold').reduce((a,d)=>a+(+d.sell||0),0);return{I,O,N:O-I,R:I?Math.round((O-I)/I*100):0}};

/* ---------- Views ---------- */
const V={};
V.dash=async()=>{
 const T=totals(),f=await kget('feed')||{},ideas=await kget('ideas')||[];
 const by=s=>D.filter(d=>d.status===s);
 const list=(a,k,t)=>a?.length?a.map(x=>`<div class="row"><div><b>${esc(x[k])}</b><small>${esc(x.why)}</small></div>${t?`<span class="tag">${score(x[k])}</span>`:''}</div>`).join(''):'<p class="muted">Nothing yet. Tap Refresh with AI.</p>';
 const months={};by('sold').forEach(d=>{const m=(d.sd||'').slice(0,7)||'n/a';months[m]=(months[m]||0)+profit(d)});
 const ms=Object.entries(months).sort().slice(-6),mx=Math.max(1,...ms.map(x=>Math.abs(x[1])));
 return`<div class="top"><h2>Dashboard</h2><div><button class="btn g" id="rf">Refresh with AI</button> <button class="btn" onclick="edit()">Add domain</button></div></div>
 <div class="grid g4"><div class="card stat"><span>Total investment</span><div class="big in">${$$$(T.I)}</div></div>
 <div class="card stat"><span>Total income</span><div class="big up">${$$$(T.O)}</div></div>
 <div class="card stat"><span>Net profit</span><div class="big ${T.N>=0?'up':'dn'}">${$$$(T.N)}</div></div>
 <div class="card stat"><span>ROI</span><div class="big ${T.R>=0?'up':'dn'}">${T.R}%</div></div></div>
 <div class="grid g3" style="margin-top:14px"><div class="card stat"><span>Owned</span><div class="big">${by('owned').length}</div></div><div class="card stat"><span>Listed</span><div class="big">${by('listed').length}</div></div><div class="card stat"><span>Sold</span><div class="big">${by('sold').length}</div></div></div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>Profit by month</h3>${ms.length?`<div class="bars">${ms.map(([m,v])=>`<div><i class="${v<0?'neg':''}" style="height:${Math.abs(v)/mx*110}px"></i>${m.slice(2)}</div>`).join('')}</div>`:'<p class="muted">Sell a domain to see monthly profit.</p>'}</div>
  <div class="card"><h3>Recently sold</h3>${by('sold').slice(-4).reverse().map(d=>`<div class="row"><div><b>${esc(d.name)}</b><small>${esc(d.sd||'')}</small></div><b class="${profit(d)>=0?'dn':'dn'}" style="color:${profit(d)>=0?'var(--gn)':'var(--rd)'}">${$$$(profit(d))}</b></div>`).join('')||'<p class="muted">No sales yet.</p>'}</div>
  <div class="card"><h3>Top domains to watch</h3>${list(f.topDomains,'name',1)}</div>
  <div class="card"><h3>Top searches</h3>${list(f.topSearches,'term')}</div>
  <div class="card"><h3>AI ideas</h3>${list(f.ideas,'name',1)}</div>
  <div class="card"><h3>My ideas</h3><div class="send" style="margin:0 0 8px"><input id="ni" placeholder="Write an idea"><button class="btn sm" id="na">Add</button></div>${ideas.map((x,i)=>`<div class="row"><span>${esc(x)}</span><button class="btn d sm" onclick="rmIdea(${i})">Remove</button></div>`).join('')||'<p class="muted">Save domain or niche ideas here.</p>'}</div>
 </div>${f.at?`<p class="muted" style="margin-top:10px;font-size:12px">AI feed updated ${new Date(f.at).toLocaleString()} with ${esc(f.model)}</p>`:''}`};
V.doms=()=>`<div class="top"><h2>Domains</h2><div><input id="q" placeholder="Search" style="width:160px;display:inline-block"> <button class="btn" onclick="edit()">Add domain</button></div></div>
 <div class="card tbl"><table><thead><tr><th>Domain</th><th>Status</th><th>Cost</th><th>Ask / sold</th><th>Profit</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
function rows(){const q=($('#q')?.value||'').toLowerCase();$('#tb').innerHTML=D.filter(d=>d.name.includes(q)).sort((a,b)=>b.id-a.id).map(d=>{const p=profit(d);return`<tr><td><b>${esc(d.name)}</b><br><small class="muted">${esc(d.reg||'')}</small></td><td><span class="tag ${d.status}">${d.status}</span></td><td>${$$$(d.buy)}</td><td>${d.status==='sold'?$$$(d.sell):d.ask?$$$(d.ask):'-'}</td><td style="color:${p>=0?'var(--gn)':'var(--rd)'}">${p==null?'-':$$$(p)}</td><td style="white-space:nowrap"><button class="btn g sm" onclick="edit(${d.id})">Edit</button> <button class="btn d sm" onclick="rm(${d.id})">Delete</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No domains yet. Add your first one.</td></tr>'}
V.ana=()=>`<div class="top"><h2>Analytics</h2></div><div class="grid g2">${D.map(d=>{const p=profit(d),s=score(d.name),h=days(d),roi=p!=null&&d.buy?Math.round(p/d.buy*100):null;return`<div class="card"><div class="row" style="border:0;padding-top:0"><h3>${esc(d.name)}</h3><span class="tag ${d.status}">${d.status}</span></div>
 <div class="row"><span>Quality score</span><b>${s}/100</b></div><div class="score"><i style="width:${s}%"></i></div>
 <div class="row"><span>Held</span><b>${h==null?'-':h+' days'}</b></div><div class="row"><span>Profit / ROI</span><b>${p==null?'-':$$$(p)+' / '+(roi??0)+'%'}</b></div>
 <div class="row"><span>Margin if sold at ask</span><b>${d.ask&&d.buy?$$$(d.ask-d.buy):'-'}</b></div>
 <button class="btn sm" style="margin-top:8px" onclick="verdict(${d.id},this)">Ask AI</button><div class="md" id="v${d.id}" style="margin-top:8px"></div></div>`}).join('')||'<div class="card muted">Add domains to see analytics.</div>'}</div>`;
V.ai=async()=>{const h=await kget('chat')||[];return`<div class="top"><h2>AI Coach</h2><button class="btn g sm" id="cc">Clear chat</button></div><div class="card"><div id="chat">${h.length?h.map(mh).join(''):'<p class="muted">Ask which domain is better, what to price a name at, or where to sell.</p>'}</div>
 <form class="send" id="cf"><input id="ci" placeholder="Which is better, ai-tools.com or toolly.ai?" autocomplete="off"><button class="btn">Send</button></form></div>`};
const mh=m=>`<div class="m ${m.r}${m.r==='a'?' md':''}">${m.r==='a'?md(m.t):esc(m.t)}${m.model?`<small>${esc(m.model)}</small>`:''}</div>`;
V.tools=()=>`<div class="top"><h2>Tools</h2></div><div class="grid g2">
 <div class="card"><h3>Quick valuation score</h3><div class="send" style="margin:0"><input id="vs" placeholder="brandable.com"><button class="btn" id="vb">Score</button></div><div id="vr" style="margin-top:12px"></div></div>
 <div class="card"><h3>AI name generator</h3><div class="send" style="margin:0"><input id="gn" placeholder="Niche, e.g. pet tech"><button class="btn" id="gb">Generate</button></div><div id="gr" class="md" style="margin-top:12px"></div></div>
 <div class="card"><h3>Profit calculator</h3><div class="f2"><div><label>Buy ($)</label><input id="pb" type="number"></div><div><label>Sell ($)</label><input id="ps" type="number"></div><div><label>Fees (%)</label><input id="pf" type="number" value="10"></div><div><label>Net</label><b id="pr" class="big">-</b></div></div></div>
 <div class="card"><h3>Backup</h3><p class="muted" style="margin-bottom:10px">Data lives only in this browser. Export regularly.</p><button class="btn g" id="ex">Export JSON</button> <button class="btn g" id="im">Import JSON</button><input type="file" id="fi" accept=".json" class="hide"></div></div>`;

/* ---------- Domain checker ---------- */
const TLDS=['com','net','org','io','ai','co','app','dev','xyz','shop','online','site'];
V.chk=()=>`<div class="top"><h2>Domain checker</h2><button class="btn g" id="ch">Cheapest extensions</button></div>
 <div class="card"><label>Names to check, one per line or comma-separated. Add an extension to check one exact domain. Leave it off to check every extension ticked below.</label>
 <textarea id="cn" rows="3" placeholder="brandly&#10;toolly.ai"></textarea>
 <div id="tl" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">${TLDS.map(t=>`<label class="tag" style="cursor:pointer;margin:0"><input type="checkbox" value="${t}" ${['com','io','ai','co'].includes(t)?'checked':''} style="width:auto;margin-right:4px">.${t}</label>`).join('')}</div>
 <button class="btn" id="cb">Check availability and price</button></div><div id="cr" style="margin-top:14px"></div>`;
async function api(u,b){
 const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(b)});
 if(r.status===401){$('#out').click();throw new Error('Session expired')}
 const d=await r.json();if(!r.ok)throw new Error((d.error||'Request failed')+(d.details?.length?' ('+d.details[0]+')':''));return d}
async function runCheck(e){
 const raw=$('#cn').value.split(/[\n,\s]+/).map(s=>s.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'')).filter(Boolean);
 const tl=$$('#tl input:checked').map(i=>i.value),names=[];
 raw.forEach(n=>n.includes('.')?names.push(n):tl.forEach(t=>names.push(n+'.'+t)));
 if(!names.length)return toast('Enter a name and tick at least one extension');
 if(names.length>30)return toast('Max 30 at once. Remove some names or extensions');
 e.target.disabled=1;$('#cr').innerHTML='<p class="muted">Checking...</p>';
 try{renderChk((await api('/api/check',{names})).results)}catch(x){$('#cr').innerHTML=`<p style="color:var(--rd)">${esc(x.message)}</p>`}
 e.target.disabled=0}
function renderChk(rs){
 const o={available:0,unknown:1,taken:2};rs.sort((a,b)=>o[a.status]-o[b.status]||(a.price??1e9)-(b.price??1e9));
 const best=rs.find(r=>r.status==='available'&&r.price!=null);
 const L={available:'Available',taken:'Taken',unknown:'Unknown'};
 $('#cr').innerHTML=(best?`<div class="card" style="margin-bottom:14px"><span class="muted">Cheapest available</span><div class="big up">${esc(best.domain)} at $${best.price.toFixed(2)}</div></div>`:'')+
 `<div class="card tbl"><table><thead><tr><th>Domain</th><th>Status</th><th>First year</th><th>Renewal</th><th>Register</th></tr></thead><tbody>${rs.map(r=>{const n=encodeURIComponent(r.domain);return`<tr><td><b>${esc(r.domain)}</b></td>
 <td><span class="tag ${r.status==='available'?'avail':r.status==='taken'?'taken':''}">${r.status==='available'&&r.likely?'Likely available':L[r.status]}</span>${r.expires?`<br><small class="muted">expires ${esc(r.expires)}</small>`:''}</td>
 <td>${r.price!=null?'$'+r.price.toFixed(2):'-'}</td><td>${r.renew!=null?'$'+r.renew.toFixed(2):'-'}</td>
 <td style="white-space:nowrap">${r.status==='taken'?'':`<a class="lk" target="_blank" rel="noopener" href="https://porkbun.com/checkout/search?q=${n}">Porkbun</a><a class="lk" target="_blank" rel="noopener" href="https://www.namecheap.com/domains/registration/results/?domain=${n}">Namecheap</a><a class="lk" target="_blank" rel="noopener" href="https://www.dynadot.com/domain/search?domain=${n}">Dynadot</a>`}
 ${r.status==='available'?`<button class="btn g sm" onclick="watch('${esc(r.domain)}',${r.price||0})">Watch</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
 <p class="muted" style="margin-top:10px;font-size:12px">Prices are Porkbun's live list. Other registrars can be cheaper with promos, so compare with the links. Premium names cost more than the listed price. Likely available means the official registry lookup did not answer and DNS shows no records, so confirm at the registrar. Unknown means both lookups failed.</p>`}
window.watch=async(name,price)=>{await putD({id:Date.now()+Math.floor(Math.random()*999),name,status:'watching',buy:price||''});toast(name+' added to Domains as Watching')};
async function cheapest(e){
 e.target.disabled=1;$('#cr').innerHTML='<p class="muted">Loading prices...</p>';
 try{const d=await api('/api/check',{cheap:true});
  $('#cr').innerHTML=`<div class="card"><h3>Cheapest extensions to register</h3>${d.cheapest.map(x=>`<div class="row"><b>.${esc(x.tld)}</b><span>$${x.reg.toFixed(2)} first year <small>renews $${x.renew.toFixed(2)}</small></span></div>`).join('')}<p class="muted" style="margin-top:8px;font-size:12px">Cheap first-year prices often come with higher renewals. Check the renewal before you buy to flip.</p></div>`}
 catch(x){$('#cr').innerHTML=`<p style="color:var(--rd)">${esc(x.message)}</p>`}
 e.target.disabled=0}

/* ---------- Actions ---------- */
async function render(){D=await allD();$('#main').innerHTML=await V[view]();$$('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));bind()}
function bind(){
 if(view==='chk'){$('#cb').onclick=runCheck;$('#ch').onclick=cheapest}
 if(view==='dash'){$('#rf').onclick=()=>feed(true);$('#na').onclick=async()=>{const v=$('#ni').value.trim();if(!v)return;const a=await kget('ideas')||[];a.unshift(v);await kset('ideas',a);render()}}
 if(view==='doms'){rows();$('#q').oninput=rows}
 if(view==='ai'){const c=$('#chat');c.scrollTop=1e9;$('#cc').onclick=async()=>{await kset('chat',[]);render()};$('#cf').onsubmit=chat}
 if(view==='tools'){
  $('#vb').onclick=()=>{const n=$('#vs').value.trim();if(!n.includes('.'))return toast('Include the extension, like name.com');const s=score(n);$('#vr').innerHTML=`<b class="big">${s}/100</b><div class="score"><i style="width:${s}%"></i></div><p class="muted" style="margin-top:6px">Based on extension, length, hyphens, digits and pronounceability. Use the AI Coach for market demand.</p>`};
  $('#gb').onclick=async e=>{const n=$('#gn').value.trim();if(!n)return;e.target.disabled=1;$('#gr').textContent='Thinking...';try{const d=await ai(`Suggest 15 brandable, short, flippable domain names for the niche "${n}". Include extensions. One per line with a 6-word reason. No numbering.`);$('#gr').innerHTML=md(d.text)}catch(x){$('#gr').textContent=x.message}e.target.disabled=0};
  const pc=()=>{const b=+$('#pb').value,s=+$('#ps').value,f=+$('#pf').value;$('#pr').textContent=s?$$$(s*(1-f/100)-b):'-'};['pb','ps','pf'].forEach(i=>$('#'+i).oninput=pc);
  $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='domaindesk-backup.json';a.click()};
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());for(const d of a)if(d.id&&d.name)await putD(d);toast('Imported '+a.length+' domains');render()}catch{toast('Invalid backup file')}}}}
window.rmIdea=async i=>{const a=await kget('ideas')||[];a.splice(i,1);await kset('ideas',a);render()};
window.rm=async id=>{if(confirm('Delete this domain?')){await delD(id);render()}};
window.edit=id=>{const d=D.find(x=>x.id===id)||{status:'owned'},m={name:'name',status:'status',reg:'reg',buy:'buy',bd:'bd',ask:'ask',sell:'sell',sd:'sd',rn:'rn',note:'note'};
 $('#dt').textContent=id?'Edit domain':'Add domain';$('#df').dataset.id=id||'';for(const k in m)$('#f_'+k).value=d[k]??'';$('#dlg').showModal()};
$('#cx').onclick=()=>$('#dlg').close();
$('#df').onsubmit=async()=>{const id=+$('#df').dataset.id||Date.now(),o={id};for(const k of['name','status','reg','buy','bd','ask','sell','sd','rn','note'])o[k]=$('#f_'+k).value.trim();o.name=o.name.toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');await putD(o);toast('Saved '+o.name);render()};
window.verdict=async(id,b)=>{const d=D.find(x=>x.id===id),el=$('#v'+id);b.disabled=1;el.textContent='Analyzing...';
 try{const r=await ai(`Analyze the domain ${d.name} for flipping. Status ${d.status}, bought for $${d.buy||0}, asking $${d.ask||'none'}. Give: verdict (buy/hold/sell/drop), realistic resale range, best buyer types, best marketplaces, and one risk. Under 120 words.`);el.innerHTML=md(r.text)+'<small class="muted">'+esc(r.model)+'</small>'}catch(x){el.textContent=x.message}b.disabled=0};
async function chat(e){e.preventDefault();if(busy)return;const i=$('#ci'),t=i.value.trim();if(!t)return;busy=true;i.value='';
 const h=await kget('chat')||[];h.push({r:'u',t});await kset('chat',h);$('#chat').insertAdjacentHTML('beforeend',mh({r:'u',t})+'<div class="m" id="typ">Thinking...</div>');$('#chat').scrollTop=1e9;
 const ctx=h.slice(-8).map(m=>(m.r==='u'?'User: ':'Advisor: ')+m.t).join('\n');
 try{const r=await ai(`Portfolio: ${summary()}.\nTotals: invested $${totals().I}, income $${totals().O}.\nConversation:\n${ctx}\nAnswer the last user message. When comparing domains, pick a winner and explain why.`);h.push({r:'a',t:r.text,model:r.model})}catch(x){h.push({r:'a',t:'Error: '+x.message})}
 await kset('chat',h);busy=false;render()}
async function feed(force){
 const f=await kget('feed');if(!force&&f&&Date.now()-f.at<864e5)return;if(busy)return;busy=true;const b=$('#rf');if(b){b.disabled=1;b.textContent='Working...'}
 try{const r=await ai(`Portfolio: ${summary()}. Today is ${new Date().toDateString()}. Return JSON only: {"topDomains":[{"name":"x.com","why":"short reason"}] (6 hot, available-style domain names or trending niches to hunt),"topSearches":[{"term":"keyword","why":"why buyers want it"}] (6 trending domain/keyword searches),"ideas":[{"name":"x.ai","why":"reason"}] (6 original brandable ideas tailored to my portfolio)}`,true);
  const j=parse(r.text);j.at=Date.now();j.model=r.model;await kset('feed',j)}catch(x){toast('AI feed: '+x.message)}
 busy=false;if(view==='dash')render()}
$('#nav').onclick=e=>{const v=e.target.dataset?.v;if(v){view=v;render()}};

async function boot(){
 if(!tok)return showLogin();
 $('#login').classList.add('hide');$('#app').classList.remove('hide');await render();feed(false)}
boot();
if(navigator.storage?.persist)navigator.storage.persist();
</script>
</body>
</html>
